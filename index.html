<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VT选品面板</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22201c;--mut:#6f6a5f;--line:#e5e0d5;--acc:#8a5a2b;--warn:#b3261e;--ok:#2e7d32}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px}
header{max-width:1200px;margin:0 auto 14px}
h1{font-size:22px;margin-bottom:6px}
.sub{color:var(--mut);font-size:13px;line-height:1.6}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px}
.tile b{font-size:20px;display:block}
.tile span{font-size:12px;color:var(--mut)}
.controls{max-width:1200px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls input{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.chip{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:1200px;margin:0 auto}
h2{font-size:17px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:250px;object-fit:cover;background:#eee;display:block}
.noimg{height:250px;background:#efe9dd;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);font-size:14px;gap:6px}
.body{padding:10px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.badge{align-self:flex-start;font-size:11px;padding:2px 8px;border-radius:999px;background:#f0e7d8;color:var(--acc)}
.brand{font-weight:700;font-size:15px}
.style{font-size:13px}
.meta{font-size:12px;color:var(--mut)}
.prices{font-size:13px;line-height:1.7;border-top:1px dashed var(--line);padding-top:6px}
.prices b{color:var(--acc)}
.flag{font-size:12px;line-height:1.55;color:#444;border-top:1px dashed var(--line);padding-top:6px}
.flag.warn{color:var(--warn)}
.links{margin-top:auto;padding-top:8px;font-size:12px}
.links a{color:var(--acc);margin-right:12px}
footer{max-width:1200px;margin:24px auto 0;color:var(--mut);font-size:12px;line-height:1.7}
.hidden{display:none}
</style>
</head>

<div class="tiles" id="tiles"></div>

<button class="chip" data-f="L2">线2 · 闲鱼直挖</button>

let filter="all",query="";
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function card(it){
 const img=it.img?`<img loading="lazy" src="${it.img}" alt="${esc(it.brand)}">`:`<div class="noimg"><div>主图待补</div><div style="font-size:12px">点下方闲鱼链接看图</div></div>`;
 const src=it.src?`<div>${it.line==="L3"?"Vinted":"海外"}：<b>${esc(it.src)}</b></div>`:"";
 const srcLink=it.srcUrl?`<a href="${it.srcUrl}" target="_blank" rel="noopener">${it.line==="L3"?"Vinted 成交页":"海外源页"}</a>`:"";
 return `<div class="card" data-line="${it.line}" data-text="${esc((it.brand+" "+it.style+" "+it.size+" "+it.id).toLowerCase())}">
 ${img}<div class="body">
 <span class="badge">${it.ln} · ${it.id}</span>
 <div class="brand">${esc(it.brand)}</div>
 <div class="style">${esc(it.style)}</div>
 <div class="meta">${esc(it.cat)} · ${esc(it.size)} · ${esc(it.cond)}</div>
 <div class="prices">${src}<div>闲鱼货源：<b>${esc(it.xy)}</b>（${esc(it.xyKind)}）</div><div>建议 Vinted：<b>${esc(it.sug)}</b></div></div>
 <div class="flag${it.warn?" warn":""}">${esc(it.flag)}</div>
 <div class="links">${srcLink}<a href="${it.xyUrl}" target="_blank" rel="noopener">闲鱼货源页</a></div>
 </div></div>`;
}
function render(){
 const main=document.getElementById("main");main.innerHTML="";
 let total=0,withImg=0;
 DATA.forEach(day=>{
   const items=day.items.filter(it=>(filter==="all"||it.line===filter)&&(!query||it.dataset!==undefined||(it.brand+" "+it.style+" "+it.size+" "+it.id).toLowerCase().includes(query)));
   if(!items.length)return;
   const h=document.createElement("h2");h.textContent=day.date+" · "+items.length+" 款";main.appendChild(h);
   const g=document.createElement("div");g.className="grid";g.innerHTML=items.map(card).join("");main.appendChild(g);
 });
 DATA.forEach(d=>d.items.forEach(it=>{total++;if(it.img)withImg++}));
 document.getElementById("tiles").innerHTML=
 `<div class="tile"><b>${total}</b><span>已选款（目标 40/天）</span></div>
  <div class="tile"><b>${withImg}</b><span>已带主图</span></div>
  <div class="tile"><b>${total-withImg}</b><span>主图待补（线2）</span></div>`;
}
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");filter=c.dataset.f;render()}));
render();
</script>
